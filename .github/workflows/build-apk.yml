name: Build Android APK
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create Complete Mobile App Structure
        run: |
          mkdir -p mobile/www
          
          # Génération automatique du package.json requis par Capacitor
          cat << 'EOF' > mobile/package.json
          {
            "name": "knacom-tontine",
            "version": "1.0.0",
            "dependencies": {
              "@capacitor/android": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/core": "^6.0.0"
            }
          }
          EOF

          # Génération de la passerelle de redirection Webview
          cat << 'EOF' > mobile/www/index.html
          <!DOCTYPE html>
          <html lang="fr">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
              <title>KNACOM Tontine</title>
              <style>
                  body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#f4f4f9; display:flex; justify-content:center; align-items:center; }
                  .loader { border:4px solid #f3f3f3; border-top:4px solid #3498db; border-radius:50%; width:40px; height:40px; animation:spin 1s linear infinite; }
                  @keyframes spin { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }
              </style>
          </head>
          <body>
              <div class="loader"></div>
              <script>window.location.href = "https://tontine-mvp.onrender.com";</script>
          </body>
          </html>
          EOF

          # Génération du fichier de configuration Capacitor
          cat << 'EOF' > mobile/capacitor.config.json
          {
            "appId": "com.knacom.tontine",
            "appName": "KNACOM Tontine",
            "webDir": "www"
          }
          EOF

      - name: Install Dependencies and Generate Native Android Project
        run: |
          cd mobile
          npm install
          npx cap add android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK with Gradle
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: KNACOM-Tontine-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
