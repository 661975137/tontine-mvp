name: Build Android APK
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create Complete Mobile App Structure
        run: |
          mkdir -p mobile/www
          
          cat << 'EOF' > mobile/package.json
          {
            "name": "knacom-tontine",
            "version": "1.0.0",
            "dependencies": {
              "@capacitor/android": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/core": "^6.0.0",
              "@capacitor-community/native-biometric": "^6.0.0"
            }
          }
          EOF

          # CODE MAJEUR : Ajout de la barrière de sécurité PIN + Empreinte sur la page d'accueil mobile
          cat << 'EOF' > mobile/www/index.html
          <!DOCTYPE html>
          <html lang="fr">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
              <title>KNACOM Tontine</title>
              <style>
                  body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#f4f4f9; display:flex; flex-direction: column; justify-content:center; align-items:center; font-family: Arial, sans-serif; }
                  .container { text-align: center; padding: 20px; }
                  .logo { font-size: 50px; margin-bottom: 20px; }
                  .title { font-size: 22px; font-weight: bold; color: #2c3e50; margin-bottom: 30px; }
                  .btn-lock { background: #2ecc71; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
                  .pin-box { display: none; margin-top: 20px; }
                  .pin-input { width: 160px; padding: 12px; text-align: center; font-size: 22px; letter-spacing: 8px; border: 2px solid #bdc3c7; border-radius: 8px; }
                  .loader { border:4px solid #f3f3f3; border-top:4px solid #3498db; border-radius:50%; width:40px; height:40px; animation:spin 1s linear infinite; margin: 20px auto; }
                  @keyframes spin { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }
              </style>
              <script src="capacitor.js"></script>
          </head>
          <body>
              <div class="container" id="lock-screen">
                  <div class="logo">🔐</div>
                  <div class="title">KNACOM Tontine Sécurisée</div>
                  <div class="loader" id="auth-loader"></div>
                  <button class="btn-lock" id="biometric-btn" onclick="declencherBiometrie()">⚡ Utiliser l'empreinte</button>
                  
                  <div class="pin-box" id="pin-container">
                      <p style="color:#7f8c8d; font-size: 14px;">Entrez votre code secret de secours</p>
                      <input type="password" class="pin-input" id="pin-field" maxlength="4" placeholder="••••" oninput="verifierPin(this.value)">
                  </div>
              </div>

              <script>
                  const NativeBiometric = window.Capacitor.Plugins.NativeBiometric;

                  // Initialisation du Code PIN de secours par défaut pour le propriétaire/client (ex: 1234)
                  // Dans une version future, on pourra laisser l'utilisateur le choisir à l'installation.
                  const PIN_SECRET = "1234"; 

                  async function verifierSecuriteAouverture() {
                      try {
                          // Étape A : On vérifie si le téléphone possède un lecteur d'empreinte activé
                          const result = await NativeBiometric.isAvailable();
                          
                          if (result.isAvailable) {
                              document.getElementById('auth-loader').style.display = 'none';
                              document.getElementById('biometric-btn').style.display = 'inline-block';
                              // Déclenchement automatique immédiat de l'empreinte digitale
                              declencherBiometrie();
                          } else {
                              // Si pas de capteur d'empreinte, on bascule direct sur le code PIN
                              afficherCodePinSecours();
                          }
                      } catch (e) {
                          // En cas de bug ou sur émulateur, on affiche le code PIN par défaut
                          afficherCodePinSecours();
                      }
                  }

                  async function declencherBiometrie() {
                      try {
                          const verified = await NativeBiometric.verifyIdentity({
                              reason: "Veuillez scanner votre empreinte pour accéder à vos tontines",
                              title: "Authentification KNACOM",
                              subtitle: "Sécurisé par empreinte digitale",
                              description: "Vérification d'identité requise."
                          });
                          
                          // Si l'empreinte est valide, redirection immédiate vers la base Cloud
                          accederApplication();
                      } catch (error) {
                          // Si l'utilisateur annule l'empreinte ou que ça échoue, on affiche le PIN
                          afficherCodePinSecours();
                      }
                  }

                  function afficherCodePinSecours() {
                      document.getElementById('auth-loader').style.display = 'none';
                      document.getElementById('biometric-btn').style.display = 'none';
                      document.getElementById('pin-container').style.display = 'block';
                      document.getElementById('pin-field').focus();
                  }

                  function verifierPin(valeur) {
                      if (valeur === PIN_SECRET) {
                          accederApplication();
                      } else if (valeur.length === 4) {
                          alert("❌ Code PIN incorrect !");
                          document.getElementById('pin-field').value = "";
                      }
                  }

                  function accederApplication() {
                      // Passage de la barrière de sécurité : Redirection fluide vers ton Render
                      window.location.href = "https://tontine-mvp.onrender.com";
                  }

                  // Lancement de la vérification dès que l'application s'ouvre sur le téléphone
                  window.onload = verifierSecuriteAouverture;
              </script>
          </body>
          </html>
          EOF

          cat << 'EOF' > mobile/capacitor.config.json
          {
            "appId": "com.knacom.tontine",
            "appName": "KNACOM Tontine",
            "webDir": "www"
          }
          EOF

      - name: Install Dependencies and Generate Native Android Project
        run: |
          cd mobile
          npm install
          npx cap add android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK with Gradle
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: KNACOM-Tontine-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
